<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Calculator — a dependable math workspace</title>
  <meta name="description" content="A calm, precise workspace for everyday calculations, guided math support, and searchable solved work.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="AI Calculator home">
        <span class="brand-mark">∑</span>
        <span>AI Calculator</span>
      </a>
      <div class="topbar-right">
        <a class="btn btn-soft btn-sm px-3" href="#home">Home</a>
        <span id="ai-status" class="d-none d-md-inline small text-secondary"></span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
          <i class="bi bi-moon-stars" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main id="app" class="page-wrap" aria-live="polite"></main>

    <footer class="page-wrap footer">
      <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
        <span>AI Calculator · a quieter way to work through math.</span>
        <span class="font-monospace">precision / context / recall</span>
      </div>
    </footer>
  </div>

  <div id="toast-area" class="toast-area" aria-live="assertive"></div>

  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;">
        <div class="modal-header border-0">
          <h2 class="modal-title fs-5" id="confirm-title">Clear your history?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-secondary">This removes every saved calculation from your workspace. It cannot be undone.</div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Keep history</button>
          <button type="button" class="btn btn-coral" id="confirm-action">Clear all</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']], processEscapes: true },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
